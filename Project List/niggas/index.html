<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Log in — BaonCheck</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="auth-screen">
  <div class="auth-card">
    <div class="auth-mark">
      <div class="mark-icon">B</div>
      <div class="mark-text">BaonCheck</div>
    </div>

    <h1>Welcome back</h1>
    <p class="auth-sub">Log in to check where your baon went.</p>

    <div id="loginError" class="auth-error hidden"></div>

    <form id="loginForm" novalidate>
      <div class="field">
        <label for="email">Gmail address</label>
        <input type="email" id="email" name="email" placeholder="you@gmail.com" required />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="••••••••" required />
      </div>
      <button type="submit" class="btn btn-primary">Log in</button>
    </form>

    <p class="field-hint" style="margin-top:14px; text-align:center;">
      Try the demo: student.baoncheck@gmail.com / password123
    </p>

    <div class="auth-foot">
      New here? <a href="register.html">Create an account</a>
    </div>
  </div>
</div>

<script src="js/store.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
