<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Profile — BaonCheck</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="app-shell">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-mark">
      <div class="mark-icon">B</div>
      <div class="mark-text">BaonCheck</div>
    </div>

    <nav>
      <div class="nav-group-label">Main</div>
      <a href="dashboard.html" class="nav-link" data-page="dashboard"><span class="nav-dot"></span>Dashboard</a>
      <a href="expenses.html" class="nav-link" data-page="expenses"><span class="nav-dot"></span>Expenses</a>
      <a href="budget.html" class="nav-link" data-page="budget"><span class="nav-dot"></span>Budget</a>
      <a href="reports.html" class="nav-link" data-page="reports"><span class="nav-dot"></span>Reports</a>

      <div class="nav-group-label">Account</div>
      <a href="profile.html" class="nav-link" data-page="profile"><span class="nav-dot"></span>Profile</a>
      <a href="admin.html" class="nav-link" data-page="admin" data-admin-only><span class="nav-dot"></span>Manage users</a>
    </nav>

    <div class="sidebar-foot">
      <div class="sidebar-user">
        <div class="avatar" id="sidebarAvatar">--</div>
        <div class="who">
          <div class="name" id="sidebarUserName">—</div>
          <div class="role" id="sidebarUserRole">—</div>
        </div>
      </div>
      <button class="btn btn-ghost btn-sm" id="logoutBtn" style="width:100%; margin-top:8px; justify-content:flex-start;">Log out</button>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div class="topbar-title" style="display:flex; align-items:flex-start;">
        <button class="menu-toggle" id="menuToggle" aria-label="Open menu">☰</button>
        <div>
          <h1>Profile</h1>
          <p>Your account information.</p>
        </div>
      </div>
    </div>

    <div class="two-col">
      <div class="panel">
        <h2>Account details</h2>
        <p style="color:var(--text-muted); font-size:0.85rem; margin-bottom:18px;">Update your name and school.</p>

        <form id="profileForm">
          <div class="field">
            <label for="name">Full name</label>
            <input type="text" id="name" required />
          </div>
          <div class="field">
            <label for="school">School</label>
            <input type="text" id="school" />
          </div>
          <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" disabled />
            <div class="field-hint">Email can't be changed in this preview.</div>
          </div>
          <button type="submit" class="btn btn-primary">Save changes</button>
        </form>
      </div>

      <div class="panel">
        <h2>Change password</h2>
        <p style="color:var(--text-muted); font-size:0.85rem; margin-bottom:18px;">Choose a new password for your account.</p>
        <form id="passwordForm">
          <div class="field">
            <label for="currentPassword">Current password</label>
            <input type="password" id="currentPassword" required />
          </div>
          <div class="field">
            <label for="newPassword">New password</label>
            <input type="password" id="newPassword" minlength="6" required />
          </div>
          <button type="submit" class="btn btn-secondary">Update password</button>
        </form>
      </div>
    </div>
  </main>
</div>

<script src="js/store.js"></script>
<script src="js/nav.js"></script>
<script src="js/profile.js"></script>
</body>
</html>
