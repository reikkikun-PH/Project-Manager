<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Expenses — BaonCheck</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="app-shell">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-mark">
      <div class="mark-icon">B</div>
      <div class="mark-text">BaonCheck</div>
    </div>

    <nav>
      <div class="nav-group-label">Main</div>
      <a href="dashboard.html" class="nav-link" data-page="dashboard"><span class="nav-dot"></span>Dashboard</a>
      <a href="expenses.html" class="nav-link" data-page="expenses"><span class="nav-dot"></span>Expenses</a>
      <a href="budget.html" class="nav-link" data-page="budget"><span class="nav-dot"></span>Budget</a>
      <a href="reports.html" class="nav-link" data-page="reports"><span class="nav-dot"></span>Reports</a>

      <div class="nav-group-label">Account</div>
      <a href="profile.html" class="nav-link" data-page="profile"><span class="nav-dot"></span>Profile</a>
      <a href="admin.html" class="nav-link" data-page="admin" data-admin-only><span class="nav-dot"></span>Manage users</a>
    </nav>

    <div class="sidebar-foot">
      <div class="sidebar-user">
        <div class="avatar" id="sidebarAvatar">--</div>
        <div class="who">
          <div class="name" id="sidebarUserName">—</div>
          <div class="role" id="sidebarUserRole">—</div>
        </div>
      </div>
      <button class="btn btn-ghost btn-sm" id="logoutBtn" style="width:100%; margin-top:8px; justify-content:flex-start;">Log out</button>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div class="topbar-title" style="display:flex; align-items:flex-start;">
        <button class="menu-toggle" id="menuToggle" aria-label="Open menu">☰</button>
        <div>
          <h1>Expenses</h1>
          <p>Record, review, and manage every transaction.</p>
        </div>
      </div>
      <div class="topbar-actions">
        <button class="btn btn-primary" id="openAddModal">+ Add expense</button>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head">
        <div>
          <h2>Expense history</h2>
          <p id="resultCount">0 records</p>
        </div>
      </div>

      <div class="filter-bar">
        <input type="text" id="searchInput" class="search-field" placeholder="Search by note…" />
        <select id="categoryFilter">
          <option value="">All categories</option>
        </select>
        <select id="dateFilter">
          <option value="all">All time</option>
          <option value="today">Today</option>
          <option value="week">This week</option>
          <option value="month">This month</option>
        </select>
      </div>

      <div class="table-wrap">
        <table class="data-table">
          <thead>
            <tr>
              <th>Date</th>
              <th>Category</th>
              <th>Note</th>
              <th style="text-align:right;">Amount</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="expenseTableBody"></tbody>
        </table>
      </div>
      <div id="emptyState" class="empty-state hidden">
        <div class="empty-icon">🔍</div>
        <p>No expenses match your filters.</p>
      </div>
    </div>
  </main>
</div>

<!-- Add / Edit modal -->
<div class="modal-backdrop hidden" id="expenseModal">
  <div class="modal">
    <div class="modal-head">
      <h3 id="modalTitle">Add expense</h3>
      <button class="btn-icon" id="closeModal" aria-label="Close">✕</button>
    </div>
    <form id="expenseForm">
      <input type="hidden" id="expenseId" />
      <div class="field-row">
        <div class="field">
          <label for="amount">Amount (₱)</label>
          <input type="number" id="amount" min="0" step="0.01" required />
        </div>
        <div class="field">
          <label for="date">Date</label>
          <input type="date" id="date" required />
        </div>
      </div>
      <div class="field">
        <label for="category">Category</label>
        <select id="category" required></select>
      </div>
      <div class="field">
        <label for="note">Note (optional)</label>
        <input type="text" id="note" placeholder="e.g. Jeepney fare" maxlength="80" />
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-secondary" id="cancelModal">Cancel</button>
        <button type="submit" class="btn btn-primary" id="saveExpenseBtn">Save expense</button>
      </div>
    </form>
  </div>
</div>

<script src="js/store.js"></script>
<script src="js/nav.js"></script>
<script src="js/expenses.js"></script>
</body>
</html>
