<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Manage users — BaonCheck</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="app-shell">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-mark">
      <div class="mark-icon">B</div>
      <div class="mark-text">BaonCheck</div>
    </div>

    <nav>
      <div class="nav-group-label">Main</div>
      <a href="dashboard.html" class="nav-link" data-page="dashboard"><span class="nav-dot"></span>Dashboard</a>
      <a href="expenses.html" class="nav-link" data-page="expenses"><span class="nav-dot"></span>Expenses</a>
      <a href="budget.html" class="nav-link" data-page="budget"><span class="nav-dot"></span>Budget</a>
      <a href="reports.html" class="nav-link" data-page="reports"><span class="nav-dot"></span>Reports</a>

      <div class="nav-group-label">Account</div>
      <a href="profile.html" class="nav-link" data-page="profile"><span class="nav-dot"></span>Profile</a>
      <a href="admin.html" class="nav-link" data-page="admin" data-admin-only><span class="nav-dot"></span>Manage users</a>
    </nav>

    <div class="sidebar-foot">
      <div class="sidebar-user">
        <div class="avatar" id="sidebarAvatar">--</div>
        <div class="who">
          <div class="name" id="sidebarUserName">—</div>
          <div class="role" id="sidebarUserRole">—</div>
        </div>
      </div>
      <button class="btn btn-ghost btn-sm" id="logoutBtn" style="width:100%; margin-top:8px; justify-content:flex-start;">Log out</button>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div class="topbar-title" style="display:flex; align-items:flex-start;">
        <button class="menu-toggle" id="menuToggle" aria-label="Open menu">☰</button>
        <div>
          <h1>Manage users</h1>
          <p>Registered students and administrators.</p>
        </div>
      </div>
    </div>

    <div id="notAdmin" class="panel hidden">
      <div class="empty-state">
        <div class="empty-icon">🔒</div>
        <p>This page is only available to administrators.</p>
      </div>
    </div>

    <div id="adminContent">
      <div class="stat-grid">
        <div class="stat-card">
          <div class="stat-label">Total users</div>
          <div class="stat-value" id="statTotalUsers">0</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Students</div>
          <div class="stat-value" id="statStudents">0</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Administrators</div>
          <div class="stat-value" id="statAdmins">0</div>
        </div>
      </div>

      <div class="panel">
        <div class="panel-head">
          <div>
            <h2>All users</h2>
            <p id="userCount">0 accounts</p>
          </div>
        </div>
        <div class="table-wrap">
          <table class="data-table">
            <thead>
              <tr>
                <th>Name</th>
                <th>Email</th>
                <th>School</th>
                <th>Role</th>
                <th>Joined</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="userTableBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </main>
</div>

<script src="js/store.js"></script>
<script src="js/nav.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
